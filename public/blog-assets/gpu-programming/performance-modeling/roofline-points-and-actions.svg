<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
  <title id="title">Roofline 图上的点与优化动作</title>
  <desc id="desc">四个示意点分别表示带宽受限、计算受限、延迟受限和利用不足。点与屋顶的距离决定下一步的分析方向。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 37px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #475569; }
      .axis { stroke: #334155; stroke-width: 2.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 8; }
      .tick { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #475569; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 650; fill: #1e293b; }
      .card-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; }
      .card-text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #334155; }
      .point-label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1600" height="1150" fill="#ffffff"/>
  <text x="80" y="70" class="title">Roofline 图上：一个点落在哪里，下一步该做什么</text>
  <text x="80" y="106" class="subtitle">所有点均为示意。虚线表示在相同 AI 下，实测性能距离理想屋顶仍有多少空间。</text>

  <rect x="190" y="170" width="1160" height="530" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M190 700 L886 223 L886 700 Z" fill="#dbeafe" opacity="0.78"/>
  <path d="M886 700 L1350 700 L1350 223 L886 223 Z" fill="#dcfce7" opacity="0.78"/>

  <g class="grid">
    <line x1="190" y1="170" x2="190" y2="700"/>
    <line x1="383" y1="170" x2="383" y2="700"/>
    <line x1="577" y1="170" x2="577" y2="700"/>
    <line x1="770" y1="170" x2="770" y2="700"/>
    <line x1="963" y1="170" x2="963" y2="700"/>
    <line x1="1157" y1="170" x2="1157" y2="700"/>
    <line x1="1350" y1="170" x2="1350" y2="700"/>
    <line x1="190" y1="700" x2="1350" y2="700"/>
    <line x1="190" y1="574" x2="1350" y2="574"/>
    <line x1="190" y1="448" x2="1350" y2="448"/>
    <line x1="190" y1="322" x2="1350" y2="322"/>
    <line x1="190" y1="197" x2="1350" y2="197"/>
  </g>
  <line x1="190" y1="700" x2="1365" y2="700" class="axis"/>
  <line x1="190" y1="715" x2="190" y2="155" class="axis"/>
  <g class="tick" text-anchor="middle">
    <text x="190" y="735">0.01</text>
    <text x="383" y="735">0.1</text>
    <text x="577" y="735">1</text>
    <text x="770" y="735">10</text>
    <text x="963" y="735">100</text>
    <text x="1157" y="735">1k</text>
    <text x="1350" y="735">10k</text>
  </g>
  <g class="tick" text-anchor="end">
    <text x="174" y="706">0.01</text>
    <text x="174" y="580">0.1</text>
    <text x="174" y="454">1</text>
    <text x="174" y="328">10</text>
    <text x="174" y="203">100</text>
  </g>
  <text x="770" y="778" class="label" text-anchor="middle">AI（FLOP / Byte，log）</text>
  <text x="64" y="442" class="label" text-anchor="middle" transform="rotate(-90 64 442)">性能 P（TFLOP/s，log）</text>

  <path d="M190 678 L886 223" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M886 223 L1350 223" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <text x="606" y="360" class="label" fill="#1d4ed8" transform="rotate(-33 606 360)">带宽屋顶</text>
  <text x="1185" y="212" class="label" fill="#15803d">计算屋顶</text>
  <circle cx="886" cy="223" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
  <text x="898" y="250" class="tick" fill="#b91c1c">屋脊 40 FLOP/B</text>

  <line x1="426" y1="523" x2="426" y2="536" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="426" cy="536" r="12" fill="#e11d48" stroke="#ffffff" stroke-width="5"/>
  <text x="445" y="527" class="point-label">A：SAXPY 类</text>

  <line x1="1125" y1="223" x2="1125" y2="233" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="1125" cy="233" r="12" fill="#7c3aed" stroke="#ffffff" stroke-width="5"/>
  <text x="1144" y="260" class="point-label">B：大 GEMM</text>

  <line x1="426" y1="523" x2="426" y2="662" stroke="#f97316" stroke-width="3.5" stroke-dasharray="7 7"/>
  <circle cx="426" cy="662" r="12" fill="#f97316" stroke="#ffffff" stroke-width="5"/>
  <text x="445" y="681" class="point-label">C：指针追逐</text>

  <line x1="770" y1="300" x2="770" y2="486" stroke="#0f766e" stroke-width="3.5" stroke-dasharray="7 7"/>
  <circle cx="770" cy="486" r="12" fill="#0f766e" stroke="#ffffff" stroke-width="5"/>
  <text x="790" y="510" class="point-label">D：小 grid</text>

  <text x="1070" y="674" class="tick" text-anchor="middle">虚线越长，越说明还没有充分利用理想上界；先找空隙的原因，再谈优化。</text>

  <g filter="url(#shadow)">
    <rect x="45" y="830" width="355" height="250" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="72" y="870" class="card-title" fill="#be123c">A：贴近带宽斜线</text>
    <text x="72" y="907" class="card-text">AI 在屋脊左侧，且 DRAM 吞吐</text>
    <text x="72" y="934" class="card-text">接近该访问模式的可持续带宽。</text>
    <text x="72" y="975" class="card-text" font-weight="700">下一步：减少 Q。</text>
    <text x="72" y="1002" class="card-text">融合、复用、合并访问、减少中间写回。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="830" width="355" height="250" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="457" y="870" class="card-title" fill="#c2410c">C：远低于带宽斜线</text>
    <text x="457" y="907" class="card-text">AI 很低，但 DRAM 吞吐也很低；</text>
    <text x="457" y="934" class="card-text">warp 在等依赖，带宽并未被喂满。</text>
    <text x="457" y="975" class="card-text" font-weight="700">下一步：查延迟。</text>
    <text x="457" y="1002" class="card-text">增加独立请求、软件流水、减少依赖和同步。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="830" width="355" height="250" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="842" y="870" class="card-title" fill="#0f766e">D：远低于所有屋顶</text>
    <text x="842" y="907" class="card-text">先确认 CTA 数、tail wave、CPU launch</text>
    <text x="842" y="934" class="card-text">gap、stream 串行和设备空闲。</text>
    <text x="842" y="975" class="card-text" font-weight="700">下一步：增加供给。</text>
    <text x="842" y="1002" class="card-text">批处理、融合、grid-stride、减少同步。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1200" y="830" width="355" height="250" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="1227" y="870" class="card-title" fill="#6d28d9">B：贴近计算平线</text>
    <text x="1227" y="907" class="card-text">AI 在屋脊右侧，且 FMA 或 Tensor</text>
    <text x="1227" y="934" class="card-text">pipe 接近相同精度的持续峰值。</text>
    <text x="1227" y="975" class="card-text" font-weight="700">下一步：改计算路径。</text>
    <text x="1227" y="1002" class="card-text">减少计算，或使用匹配的更快 MMA 路径。</text>
  </g>

  <text x="45" y="1122" class="subtitle">结论不是由点的左右位置单独决定：左/右回答“理想屋顶是谁”，点与屋顶的距离和 NCU/NSYS 证据才回答“现在为什么慢”。</text>
</svg>
